name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - name: flutter gen-l10n
        if: hashFiles('l10n.yaml') != ''
        run: flutter gen-l10n
        continue-on-error: false
      - run: flutter analyze
      - run: flutter test
      # gradlew no está versionado: flutter lo genera al compilar, así que el APK va primero.
      - run: flutter build apk --debug
      # Solo el módulo app: las pruebas de los plugins (Robolectric) exigen Java 21.
      - run: ./gradlew :app:testDebugUnitTest
        working-directory: android

  android-emulator:
    needs: flutter
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: flutter pub get
      - run: flutter gen-l10n
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          script: |
            flutter test integration_test/alarm_crud_test.dart
            flutter test integration_test/alarm_fires_test.dart --no-uninstall
            adb shell pidof com.migdlp.gentlealarm || echo "app no está en ejecución (en segundo plano/cerrada)"
            sleep 215
            adb logcat -d > logcat.txt
            adb shell dumpsys audio > audio.txt
            adb shell dumpsys alarm | grep -B1 -A4 gentlealarm > alarm.txt || true
            grep -E "RingLauncher|AlarmReceiver|RingService|AlarmAudioPlayer|FATAL EXCEPTION|AndroidRuntime" logcat.txt || true
            grep -q "RingLauncher.*FIRE" logcat.txt
            grep "AudioPlaybackConfiguration" audio.txt | grep "USAGE_ALARM" | grep -q "state:started"
      - name: Subir diagnóstico del emulador
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-alarma
          path: |
            logcat.txt
            audio.txt
            alarm.txt
